<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Rounded Background -->
  <rect width="48" height="48" rx="12" fill="#F1F5F9"/>
  <!-- Factory Skyline in Background -->
  <path d="M10 36V26L16 29V24L22 27V20L28 24V36H10Z" fill="#CBD5E1"/>
  <!-- Industrial Conveyor / Floor Base -->
  <line x1="8" y1="38" x2="40" y2="38" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Modern Industrial Gears -->
  <g transform="translate(29, 23)">
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#0284C7"/>
    <!-- Gear teeth -->
    <path d="M0 -11V-8 M0 8V11 M-11 0H-8 M8 0H11 M-8 -8L-6 -6 M6 6L8 8 M-8 8L-6 6 M6 -6L8 -8" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Smaller Interlocking Gear -->
  <g transform="translate(18, 30)">
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#64748B"/>
  </g>
</svg>
